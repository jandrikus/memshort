[project]
name = "memshort"
version = "0.1.0"
description = "Observational compaction for agent sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alex", email = "jandrikus@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
# Hermes provides this package at runtime; it is not a dependency of memshort.
ignore-missing-imports = ["agent.*"]

[project.scripts]
memshort = "memshort:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]
